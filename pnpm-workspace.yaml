packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
allowBuilds:
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - sharp

# Supply-chain soak: refuse packages published less than 24h ago, so a compromised
# release has a window to be caught and unpublished before it reaches a build.
# Strict mode makes the soak a hard gate rather than an advisory warning; without
# it pnpm auto-writes `minimumReleaseAgeExclude` entries and installs anyway.
# Mirrors `minimumReleaseAge` in the renovate preset, which shortens it to 1 day
# for vulnerability alerts rather than to zero.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # Renovate security update: astro@7.2.8
  - astro@7.2.8
  # min-release-age: lift universal-plugin@0.14.0 until 2026-10-13T02:00:00Z
  - universal-plugin@0.14.0
  # min-release-age: lift cyber-agentkit@1.0.0 until 2026-10-22T09:00:00Z
  - cyber-agentkit@1.0.0
