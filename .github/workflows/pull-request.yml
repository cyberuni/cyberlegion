name: pull-request
on:
  pull_request:
    # `reopened`, `labeled`, `unlabeled`: the dep-changeset gate in code.yml reads
    # Renovate's labels, which arrive in a second API call after the PR opens.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Called `code` so its roll-up job reports the required `code / all-checks` check.
  code:
    uses: ./.github/workflows/code.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      AUTOFIX_APP_ID: ${{ secrets.AUTOFIX_APP_ID }}
      AUTOFIX_APP_PRIVATE_KEY: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

  publish-gate:
    if: startsWith(github.head_ref, 'changeset-release/')
    uses: cyberuni/.github/.github/workflows/pnpm-publish-gate.yml@main
    permissions:
      contents: read
    with:
      allowed-new-dependencies: cyber-agentkit
